# word-park 素材服务器配置 (ECS Windows Server)
# 部署位置: C:\Users\Administrator\Desktop\nginx-1.31.8\conf\nginx.conf
# 素材目录: C:\www\assets (本地 upload-cloud/ 的镜像)
# 访问地址: http://47.93.245.108:8081/assets/...
# 启动: nginx.exe 直接运行;开机自启: schtasks 任务 wordpark-nginx

worker_processes  1;
error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nodelay   on;
    keepalive_timeout  65;

    server {
        listen       8081;
        server_name  _;

        root         C:/www;

        location /assets/ {
            expires 30d;
            add_header Cache-Control "public";
        }
    }
}
