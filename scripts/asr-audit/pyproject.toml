[project]
name = "asr-audit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "吴瑞", email = "wurui@guoguokeji.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "imageio-ffmpeg>=0.8.1",
    "pypinyin>=0.55.0",
]

[project.scripts]
